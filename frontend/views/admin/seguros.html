<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

    <div class="flex min-h-screen">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
            <div class="p-4 sm:p-6 lg:p-8">

                <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-display font-semibold text-xl lg:text-[22px]">Catálogo de seguros</h1>
                        <p class="text-[13px] text-neblina mt-1">Convenios médicos disponibles para vincular a pacientes
                        </p>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button onclick="abrirModalCrear()"
                            class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity">
                            <i class="bi bi-shield-plus"></i> Nuevo seguro
                        </button>
                        <button id="themeToggle" title="Cambiar tema"
                            class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
                            <i class="bi bi-moon-stars" id="theme-icon"></i>
                        </button>
                    </div>
                </header>

                <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-tinta/10 dark:bg-tinta-light/20 flex items-center justify-center text-tinta dark:text-white text-xl flex-shrink-0">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-total">—
                            </div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Total seguros</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-activos">—
                            </div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Convenios activos</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center text-amber-600 dark:text-amber-400 text-xl flex-shrink-0">
                            <i class="bi bi-percent"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none"
                                id="m-cobertura-promedio">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Cobertura promedio</div>
                        </div>
                    </div>
                </section>

                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
                    <div
                        class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2 class="font-display font-semibold text-[15px]">Seguros médicos</h2>
                        <span class="text-xs text-neblina" id="total-mostrados"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[13px] min-w-[620px]">
                            <thead>
                                <tr class="bg-lienzo dark:bg-tinta-dark border-b border-borde dark:border-borde-dark">
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Nombre</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Tipo</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Cobertura</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Deducible</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Estado</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-seguros" class="divide-y divide-borde dark:divide-borde-dark">
                                <tr>
                                    <td colspan="6" class="text-center text-neblina py-10 text-[13px]">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pager-seguros"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Crear Seguro -->
    <div class="hidden fixed inset-0 bg-black/45 z-[200] items-center justify-center p-5" id="modalCrearSeguro">
        <div class="bg-white dark:bg-superficie-dark rounded-2xl w-full max-w-[480px] overflow-hidden">
            <div class="flex items-center justify-between px-6 py-5 border-b border-borde dark:border-borde-dark">
                <h3 class="font-display font-semibold text-base flex items-center gap-2">
                    <i class="bi bi-shield-plus text-guia"></i> Nuevo seguro médico
                </h3>
                <button onclick="cerrarModal('modalCrearSeguro')"
                    class="text-neblina hover:text-alerta hover:bg-alerta/10 rounded-lg p-1.5 transition-colors">
                    <i class="bi bi-x text-xl"></i>
                </button>
            </div>
            <div class="px-6 py-5">
                <div class="mb-4">
                    <label class="block text-xs font-medium mb-1.5">Nombre del seguro *</label>
                    <input type="text" id="seg-nombre" placeholder="Ej: Rímac Salud"
                        class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-medium mb-1.5">Tipo *</label>
                    <select id="seg-tipo"
                        class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors">
                        <option value="PRIVADO">Privado</option>
                        <option value="PUBLICO">Público</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-medium mb-1.5">Porcentaje de cobertura (%) *</label>
                    <input type="number" id="seg-cobertura" placeholder="30" min="0" max="100" step="0.01"
                        class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1.5">Deducible (S/)</label>
                    <input type="number" id="seg-deducible" placeholder="20.00" min="0" step="0.01"
                        class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                    <div class="text-[11px] text-neblina mt-1">Déjalo vacío si no aplica (S/ 0.00)</div>
                </div>
            </div>
            <div
                class="flex justify-end gap-2.5 px-6 py-4 bg-lienzo dark:bg-tinta-dark border-t border-borde dark:border-borde-dark">
                <button onclick="cerrarModal('modalCrearSeguro')"
                    class="px-4 py-2.5 rounded-lg text-sm font-medium bg-white dark:bg-tinta border border-borde dark:border-borde-dark text-neblina hover:text-tinta dark:hover:text-white transition-colors">
                    Cancelar
                </button>
                <button onclick="guardarSeguro()"
                    class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity">
                    <i class="bi bi-check-lg"></i> Crear seguro
                </button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/seguroService.js"></script>
    <script src="/js/services/adminService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/pagination.js"></script>
    <script src="/js/admin/seguros.js"></script>
</body>

</html>
