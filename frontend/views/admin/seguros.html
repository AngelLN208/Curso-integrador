<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguros — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>

<body>

    <div class="app-shell">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1 class="page-title">Catálogo de seguros</h1>
                    <p class="page-sub">Convenios médicos disponibles para vincular a pacientes</p>
                </div>
                <div class="topbar-right">
                    <button class="btn-primary" onclick="abrirModalCrear()">
                        <i class="bi bi-shield-plus"></i> Nuevo seguro
                    </button>
                    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                        <i class="bi bi-moon-stars" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Métricas -->
            <section class="metrics-grid" style="grid-template-columns:repeat(3,1fr)">
                <div class="metric-card">
                    <div class="metric-icon indigo"><i class="bi bi-shield-check"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-total">—</div>
                        <div class="metric-label">Total seguros</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon green"><i class="bi bi-check-circle"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-activos">—</div>
                        <div class="metric-label">Convenios activos</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon amber"><i class="bi bi-percent"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-cobertura-promedio">—</div>
                        <div class="metric-label">Cobertura promedio</div>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <div class="card">
                <div class="card-head">
                    <h2 class="card-title">Seguros médicos</h2>
                    <span class="metric-delta neutral" id="total-mostrados"></span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Cobertura</th>
                                <th>Deducible</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-seguros">
                            <tr>
                                <td colspan="6" class="empty-row">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Crear Seguro -->
    <div class="modal-backdrop" id="modalCrearSeguro">
        <div class="modal-box" style="max-width:480px">
            <div class="modal-header">
                <h3 class="modal-title"><i class="bi bi-shield-plus" style="color:var(--indigo)"></i> Nuevo seguro
                    médico</h3>
                <button class="modal-close" onclick="cerrarModal('modalCrearSeguro')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="field-group">
                    <label class="form-label">Nombre del seguro *</label>
                    <input type="text" id="seg-nombre" class="form-control" placeholder="Ej: Rímac Salud">
                </div>
                <div class="field-group">
                    <label class="form-label">Tipo *</label>
                    <select id="seg-tipo" class="form-control">
                        <option value="PRIVADO">Privado</option>
                        <option value="PUBLICO">Público</option>
                    </select>
                </div>
                <div class="field-group">
                    <label class="form-label">Porcentaje de cobertura (%) *</label>
                    <input type="number" id="seg-cobertura" class="form-control" placeholder="30" min="0" max="100"
                        step="0.01">
                </div>
                <div class="field-group">
                    <label class="form-label">Deducible (S/)</label>
                    <input type="number" id="seg-deducible" class="form-control" placeholder="20.00" min="0"
                        step="0.01">
                    <div style="font-size:11px;color:var(--text-3);margin-top:4px">Déjalo vacío si no aplica (S/ 0.00)
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="cerrarModal('modalCrearSeguro')">Cancelar</button>
                <button class="btn btn-indigo" onclick="guardarSeguro()">
                    <i class="bi bi-check-lg"></i> Crear seguro
                </button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/seguroService.js"></script>
    <script src="/js/services/adminService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/admin/seguros.js"></script>
</body>

</html>
