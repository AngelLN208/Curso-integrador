<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

    <div class="flex min-h-screen">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
            <div class="p-4 sm:p-6 lg:p-8">

                <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-display font-semibold text-xl lg:text-[22px]">Auditoría del sistema</h1>
                        <p class="text-[13px] text-neblina mt-1">Historial completo de acciones sobre citas médicas</p>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button onclick="descargarReportePdf()"
                            class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity">
                            <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
                        </button>
                        <button id="themeToggle" title="Cambiar tema"
                            class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
                            <i class="bi bi-moon-stars" id="theme-icon"></i>
                        </button>
                    </div>
                </header>

                <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
                            <i class="bi bi-plus-circle"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-creaciones">—
                            </div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Citas creadas</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400 text-xl flex-shrink-0">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none"
                                id="m-confirmaciones">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Confirmaciones</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-guia/10 flex items-center justify-center text-guia text-xl flex-shrink-0">
                            <i class="bi bi-arrow-repeat"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none"
                                id="m-reprogramaciones">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Reprogramaciones</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-alerta/10 flex items-center justify-center text-alerta text-xl flex-shrink-0">
                            <i class="bi bi-x-circle"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none"
                                id="m-cancelaciones">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Cancelaciones</div>
                        </div>
                    </div>
                </section>

                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden mb-5">
                    <div
                        class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2 class="font-display font-semibold text-[15px]"><i class="bi bi-funnel text-guia mr-1.5"></i>
                            Filtros</h2>
                        <button onclick="limpiarFiltros()"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-neblina hover:text-tinta dark:hover:text-white transition-colors">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                        </button>
                    </div>
                    <div class="p-5 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-medium mb-1.5">Usuario</label>
                            <select id="filtro-usuario"
                                class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors">
                                <option value="">Todos los usuarios</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1.5">Tipo de acción</label>
                            <select id="filtro-accion"
                                class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors">
                                <option value="">Todas las acciones</option>
                                <option value="CREACION">Creación</option>
                                <option value="CONFIRMACION">Confirmación</option>
                                <option value="REPROGRAMACION">Reprogramación</option>
                                <option value="CANCELACION">Cancelación</option>
                                <option value="ATENDIDA">Atendida</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1.5">Buscar paciente</label>
                            <input type="text" id="filtro-paciente" placeholder="Nombre del paciente..."
                                class="w-full px-3.5 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                        </div>
                    </div>
                </div>

                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
                    <div
                        class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2 class="font-display font-semibold text-[15px]">Registro de auditoría</h2>
                        <span class="text-xs text-neblina" id="total-mostrados"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[13px] min-w-[760px]">
                            <thead>
                                <tr class="bg-lienzo dark:bg-tinta-dark border-b border-borde dark:border-borde-dark">
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Fecha y hora</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Usuario</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Acción</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Paciente / Cita</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Estado anterior</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Estado nuevo</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-auditoria" class="divide-y divide-borde dark:divide-borde-dark">
                                <tr>
                                    <td colspan="6" class="text-center text-neblina py-10 text-[13px]">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/adminService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/admin/audit.js"></script>
</body>

</html>
