<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>

<body>

    <div class="app-shell">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1 class="page-title">Auditoría del sistema</h1>
                    <p class="page-sub">Historial completo de acciones sobre citas médicas</p>
                </div>
                <div class="topbar-right">
                    <button class="btn-primary" onclick="descargarReportePdf()">
                        <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
                    </button>
                    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                        <i class="bi bi-moon-stars" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Métricas -->
            <section class="metrics-grid" style="grid-template-columns:repeat(4,1fr)">
                <div class="metric-card">
                    <div class="metric-icon green"><i class="bi bi-plus-circle"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-creaciones">—</div>
                        <div class="metric-label">Citas creadas</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon blue"><i class="bi bi-check-circle"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-confirmaciones">—</div>
                        <div class="metric-label">Confirmaciones</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon amber"><i class="bi bi-arrow-repeat"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-reprogramaciones">—</div>
                        <div class="metric-label">Reprogramaciones</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon red"><i class="bi bi-x-circle"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-cancelaciones">—</div>
                        <div class="metric-label">Cancelaciones</div>
                    </div>
                </div>
            </section>

            <!-- Filtros -->
            <div class="card" style="margin-bottom:20px">
                <div class="card-head">
                    <h2 class="card-title"><i class="bi bi-funnel" style="color:var(--indigo)"></i> Filtros</h2>
                    <button class="btn btn-sm btn-ghost" onclick="limpiarFiltros()">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                    </button>
                </div>
                <div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
                    <div>
                        <label class="form-label">Usuario</label>
                        <select id="filtro-usuario" class="form-control">
                            <option value="">Todos los usuarios</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Tipo de acción</label>
                        <select id="filtro-accion" class="form-control">
                            <option value="">Todas las acciones</option>
                            <option value="CREACION">Creación</option>
                            <option value="CONFIRMACION">Confirmación</option>
                            <option value="REPROGRAMACION">Reprogramación</option>
                            <option value="CANCELACION">Cancelación</option>
                            <option value="ATENDIDA">Atendida</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Buscar paciente</label>
                        <input type="text" id="filtro-paciente" class="form-control"
                            placeholder="Nombre del paciente...">
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card">
                <div class="card-head">
                    <h2 class="card-title">Registro de auditoría</h2>
                    <span class="metric-delta neutral" id="total-mostrados"></span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Fecha y hora</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Paciente / Cita</th>
                                <th>Estado anterior</th>
                                <th>Estado nuevo</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-auditoria">
                            <tr>
                                <td colspan="6" class="empty-row">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/adminService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/admin/audit.js"></script>
</body>

</html>
