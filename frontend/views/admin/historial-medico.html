<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

    <div class="flex min-h-screen">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
            <div class="p-4 sm:p-6 lg:p-8">

                <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-display font-semibold text-xl lg:text-[22px]">Historial médico</h1>
                        <p class="text-[13px] text-neblina mt-1">Consultas, diagnósticos y tratamientos por paciente</p>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button id="themeToggle" title="Cambiar tema"
                            class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
                            <i class="bi bi-moon-stars" id="theme-icon"></i>
                        </button>
                    </div>
                </header>

                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 mb-5 relative">
                    <label class="block text-xs font-medium mb-1.5">Selecciona un paciente</label>
                    <div class="relative">
                        <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                        <input type="text" id="buscar-paciente" placeholder="Buscar por DNI, nombre o apellido..."
                            class="w-full pl-10 pr-4 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                    </div>
                    <div id="resultados-busqueda"
                        class="hidden mt-2 absolute left-4 right-4 z-20 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg p-1.5 shadow-lg max-h-64 overflow-y-auto">
                    </div>
                </div>

                <div class="hidden bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 mb-5"
                    id="card-paciente">
                    <div class="flex items-center gap-4">
                        <div id="paciente-iniciales"
                            class="w-[52px] h-[52px] rounded-full flex-shrink-0 bg-guia flex items-center justify-center text-xl font-display font-bold text-tinta">
                        </div>
                        <div>
                            <div class="text-[17px] font-display font-semibold" id="paciente-nombre"></div>
                            <div class="text-[13px] text-neblina" id="paciente-dni"></div>
                        </div>
                    </div>
                </div>

                <section class="hidden grid-cols-1 sm:grid-cols-3 gap-3 mb-6" id="metricas-historial">
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-tinta/10 dark:bg-tinta-light/20 flex items-center justify-center text-tinta dark:text-white text-xl flex-shrink-0">
                            <i class="bi bi-file-medical"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold leading-none"
                                id="m-total-consultas">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Total consultas</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400 text-xl flex-shrink-0">
                            <i class="bi bi-calendar-check"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-lg lg:text-xl font-semibold leading-none"
                                id="m-ultima-consulta">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Última consulta</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
                            <i class="bi bi-heart-pulse"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-base lg:text-lg font-semibold leading-tight truncate"
                                id="m-medico-frecuente">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Médico más frecuente</div>
                        </div>
                    </div>
                </section>

                <div class="hidden bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden"
                    id="card-historial">
                    <div class="flex items-center px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2 class="font-display font-semibold text-[15px]">
                            <i class="bi bi-clock-history text-guia mr-1.5"></i> Historial de consultas
                        </h2>
                    </div>
                    <div id="lista-consultas" class="p-5">
                        <div class="text-center text-neblina py-10 text-[13px]">Cargando...</div>
                    </div>
                    <div id="pager-historial-admin"></div>
                </div>

                <div class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card"
                    id="card-vacio">
                    <div class="text-center py-16 px-5">
                        <i class="bi bi-person-search text-3xl block mb-3 text-neblina"></i>
                        <span class="text-neblina text-[13px]">Busca un paciente para ver su historial médico</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/pacienteService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/pagination.js"></script>
    <script src="/js/admin/historial-medico.js"></script>
</body>

</html>
