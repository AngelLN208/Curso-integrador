<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Clínica Stella Maris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

  <div class="flex min-h-screen">
    <div id="sidebar-placeholder"></div>

    <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
      <div class="p-4 sm:p-6 lg:p-8">

        <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
          <div>
            <h1 class="font-display font-semibold text-xl lg:text-[22px]">Dashboard</h1>
            <p class="text-[13px] text-neblina mt-1" id="greeting">Cargando...</p>
          </div>
          <div class="flex items-center gap-2.5">
            <div
              class="hidden sm:flex items-center gap-2 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-neblina">
              <i class="bi bi-calendar3"></i>
              <span id="fecha-hoy"></span>
            </div>
            <button id="themeToggle" title="Cambiar tema"
              class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
              <i class="bi bi-moon-stars" id="theme-icon"></i>
            </button>
            <a href="/views/recepcionist/appointments.html"
              class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity whitespace-nowrap">
              <i class="bi bi-plus-lg"></i> Nueva cita
            </a>
          </div>
        </header>

        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <div class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4">
            <div class="flex items-center gap-3">
              <div
                class="w-11 h-11 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400 text-xl flex-shrink-0">
                <i class="bi bi-calendar-check"></i>
              </div>
              <div class="min-w-0">
                <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-citas-hoy">—</div>
                <div class="text-[11px] lg:text-xs text-neblina mt-1">Citas hoy</div>
              </div>
            </div>
            <div class="text-[11px] text-rumbo font-medium mt-2" id="m-confirmadas-pct"></div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
              <i class="bi bi-check-circle"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-confirmadas">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Confirmadas</div>
            </div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-guia/10 flex items-center justify-center text-guia text-xl flex-shrink-0">
              <i class="bi bi-clock"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-pendientes">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Pendientes de pago</div>
            </div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center text-purple-600 dark:text-purple-400 text-xl flex-shrink-0">
              <i class="bi bi-people"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold leading-none" id="m-pacientes">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Pacientes registrados</div>
            </div>
          </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark">
              <h2 class="font-display font-semibold text-[15px]">
                <i class="bi bi-calendar-day text-blue-500 mr-1.5"></i> Citas de hoy
              </h2>
              <a href="/views/recepcionist/appointments.html" class="text-xs text-guia font-medium hover:underline">Ver
                todas</a>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-[13px] min-w-[420px]">
                <thead>
                  <tr class="bg-lienzo dark:bg-tinta-dark border-b border-borde dark:border-borde-dark">
                    <th class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                      Hora</th>
                    <th class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                      Paciente</th>
                    <th class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                      Especialidad</th>
                    <th class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                      Estado</th>
                  </tr>
                </thead>
                <tbody id="tabla-citas-hoy" class="divide-y divide-borde dark:divide-borde-dark">
                  <tr>
                    <td colspan="4" class="text-center text-neblina py-10 text-[13px]">Cargando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
            <div
              class="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-borde dark:border-borde-dark">
              <h2 class="font-display font-semibold text-[15px]">
                <i class="bi bi-calendar-week text-guia mr-1.5"></i> Próximas citas
              </h2>
              <div class="flex items-center gap-1.5">
                <input type="date" id="filtro-fecha-proximas" title="Filtrar por fecha"
                  class="text-xs px-2.5 py-1.5 border border-borde dark:border-borde-dark rounded-lg bg-white dark:bg-tinta-dark outline-none focus:border-guia cursor-pointer">
                <button
                  onclick="document.getElementById('filtro-fecha-proximas').value='';renderProximas(todasLasCitas)"
                  title="Limpiar filtro" class="text-neblina hover:text-alerta p-1 transition-colors">
                  <i class="bi bi-x-circle"></i>
                </button>
              </div>
            </div>
            <div id="proximas-citas" class="p-1.5">
              <div class="text-center text-neblina py-10 text-[13px]">Cargando...</div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/citaService.js"></script>
  <script src="/js/services/pacienteService.js"></script>
  <script src="/js/services/medicoService.js"></script>
  <script src="/js/utils/ui.js"></script>
  <script src="/js/utils/sidebar.js"></script>
  <script src="/js/recepcionist/dashboard.js"></script>
</body>

</html>
