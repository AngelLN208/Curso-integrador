<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Clínica Stella Maris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body>

<div class="app-shell">

  <!-- Sidebar -->
  <div id="sidebar-placeholder"></div>

  <!-- Main -->
  <main class="main-content">

    <header class="topbar">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub" id="greeting">Cargando...</p>
      </div>
      <div class="topbar-right">
        <div class="date-badge">
          <i class="bi bi-calendar3"></i>
          <span id="fecha-hoy"></span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
          <i class="bi bi-moon-stars" id="theme-icon"></i>
        </button>
        <a href="/views/recepcionist/appointments.html" class="btn-primary">
          <i class="bi bi-plus-lg"></i> Nueva cita
        </a>
      </div>
    </header>

    <!-- Métricas -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon blue"><i class="bi bi-calendar-check"></i></div>
        <div class="metric-body">
          <div class="metric-value" id="m-citas-hoy">—</div>
          <div class="metric-label">Citas hoy</div>
        </div>
        <div class="metric-delta up" id="m-confirmadas-pct"></div>
      </div>
      <div class="metric-card">
        <div class="metric-icon green"><i class="bi bi-check-circle"></i></div>
        <div class="metric-body">
          <div class="metric-value" id="m-confirmadas">—</div>
          <div class="metric-label">Confirmadas</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon amber"><i class="bi bi-clock"></i></div>
        <div class="metric-body">
          <div class="metric-value" id="m-pendientes">—</div>
          <div class="metric-label">Pendientes de pago</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon purple"><i class="bi bi-people"></i></div>
        <div class="metric-body">
          <div class="metric-value" id="m-pacientes">—</div>
          <div class="metric-label">Pacientes registrados</div>
        </div>
      </div>
    </section>

    <!-- Contenido -->
    <div class="content-grid">

      <!-- Citas de hoy -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">
            <i class="bi bi-calendar-day" style="color:var(--blue);margin-right:6px"></i>
            Citas de hoy
          </h2>
          <a href="/views/recepcionist/appointments.html" class="card-link">Ver todas</a>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Hora</th>
                <th>Paciente</th>
                <th>Especialidad</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-citas-hoy">
              <tr><td colspan="4" class="empty-row">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Próximas citas -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">
            <i class="bi bi-calendar-week" style="color:var(--indigo);margin-right:6px"></i>
            Próximas citas
          </h2>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="date" id="filtro-fecha-proximas"
                   style="font-size:12px;padding:4px 8px;border:1px solid var(--border);
                          border-radius:8px;color:var(--text);background:var(--bg-card);
                          outline:none;cursor:pointer"
                   title="Filtrar por fecha">
            <button onclick="document.getElementById('filtro-fecha-proximas').value='';
                             renderProximas(todasLasCitas)"
                    style="background:none;border:none;color:var(--text-3);cursor:pointer;
                           font-size:14px;padding:2px" title="Limpiar filtro">
              <i class="bi bi-x-circle"></i>
            </button>
          </div>
        </div>
        <div id="proximas-citas" class="appt-list">
          <div class="empty-row">Cargando...</div>
        </div>
      </div>

    </div>
  </main>
</div>



<script src="/js/config.js"></script>
<script src="/js/services/api.js"></script>
<script src="/js/services/citaService.js"></script>
<script src="/js/services/pacienteService.js"></script>
<script src="/js/services/medicoService.js"></script>
<script src="/js/utils/ui.js"></script>
<script src="/js/utils/sidebar.js"></script>
<script src="/js/recepcionist/dashboard.js"></script>
</body>
</html>
