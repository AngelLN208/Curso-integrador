<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

    <div class="flex min-h-screen">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
            <div class="p-4 sm:p-6 lg:p-8">

                <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-display font-semibold text-xl lg:text-[22px] text-tinta dark:text-white">
                            Historial médico</h1>
                        <p class="text-[13px] text-neblina mt-1">Consultas, diagnósticos y tratamientos por paciente
                        </p>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button id="themeToggle" title="Cambiar tema"
                            class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
                            <i class="bi bi-moon-stars" id="theme-icon"></i>
                        </button>
                    </div>
                </header>

                <!-- Buscar paciente -->
                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 sm:p-5 mb-5">
                    <label class="block text-xs font-medium text-neblina mb-1.5">Selecciona un paciente</label>
                    <div class="relative">
                        <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                        <input type="text" id="buscar-paciente" placeholder="Buscar por DNI, nombre o apellido..."
                            class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg pl-10 pr-3.5 py-2.5 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia">
                    </div>
                    <div id="resultados-busqueda" class="hidden mt-2"></div>
                </div>

                <!-- Paciente seleccionado -->
                <div id="card-paciente"
                    class="hidden bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 sm:p-5 mb-5">
                    <div class="flex items-center gap-4">
                        <div id="paciente-iniciales"
                            class="w-13 h-13 w-[52px] h-[52px] rounded-full flex-shrink-0 bg-gradient-to-br from-guia to-guia-light flex items-center justify-center text-xl font-bold text-white">
                        </div>
                        <div class="min-w-0">
                            <div class="text-[17px] font-semibold text-tinta dark:text-white" id="paciente-nombre">
                            </div>
                            <div class="text-[13px] text-neblina" id="paciente-dni"></div>
                        </div>
                    </div>
                </div>

                <!-- Métricas -->
                <section id="metricas-historial" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-guia/10 flex items-center justify-center text-guia text-xl flex-shrink-0">
                            <i class="bi bi-file-medical"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                                id="m-total-consultas">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Total consultas</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-tinta/10 dark:bg-tinta-light/20 flex items-center justify-center text-tinta dark:text-white text-xl flex-shrink-0">
                            <i class="bi bi-calendar-check"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                                id="m-ultima-consulta">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Última consulta</div>
                        </div>
                    </div>
                    <div
                        class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
                            <i class="bi bi-heart-pulse"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-display text-[15px] font-semibold text-tinta dark:text-white leading-tight truncate"
                                id="m-medico-frecuente">—</div>
                            <div class="text-[11px] lg:text-xs text-neblina mt-1">Médico más frecuente</div>
                        </div>
                    </div>
                </section>

                <!-- Historial -->
                <div id="card-historial"
                    class="hidden bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
                    <div class="px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2
                            class="font-display font-semibold text-[15px] text-tinta dark:text-white flex items-center gap-2">
                            <i class="bi bi-clock-history text-guia"></i> Historial de consultas
                        </h2>
                    </div>
                    <div id="lista-consultas" class="p-5">
                        <div class="text-center text-neblina py-10 text-[13px]">Cargando...</div>
                    </div>
                </div>

                <div id="card-vacio"
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card">
                    <div class="text-center text-neblina text-[13px] py-16 px-5">
                        <i class="bi bi-person-search block text-3xl mb-3"></i>
                        Busca un paciente para ver su historial médico
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/pacienteService.js"></script>
    <script src="/js/services/atencionService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/medico/historial-medico.js"></script>
</body>

</html>
