<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body>

    <div class="app-shell">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1 class="page-title">Historial médico</h1>
                    <p class="page-sub">Consultas, diagnósticos y tratamientos por paciente</p>
                </div>
                <div class="topbar-right">
                    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                        <i class="bi bi-moon-stars" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Buscar paciente -->
            <div class="card" style="margin-bottom:20px">
                <div style="padding:16px 20px">
                    <label class="form-label">Selecciona un paciente</label>
                    <div style="position:relative">
                        <i class="bi bi-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);
                    color:var(--text-3);font-size:15px"></i>
                        <input type="text" id="buscar-paciente" class="form-control"
                            placeholder="Buscar por DNI, nombre o apellido..." style="padding-left:40px">
                    </div>
                    <div id="resultados-busqueda" style="margin-top:8px;display:none"></div>
                </div>
            </div>

            <!-- Paciente seleccionado -->
            <div class="card" id="card-paciente" style="display:none;margin-bottom:20px">
                <div style="padding:16px 20px;display:flex;align-items:center;gap:16px">
                    <div id="paciente-iniciales" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;
              background:linear-gradient(135deg,var(--indigo),var(--blue));
              display:flex;align-items:center;justify-content:center;
              font-size:20px;font-weight:700;color:white"></div>
                    <div>
                        <div style="font-size:17px;font-weight:700;color:var(--text)" id="paciente-nombre"></div>
                        <div style="font-size:13px;color:var(--text-3)" id="paciente-dni"></div>
                    </div>
                </div>
            </div>

            <!-- Métricas -->
            <section class="metrics-grid" style="grid-template-columns:repeat(3,1fr);display:none"
                id="metricas-historial">
                <div class="metric-card">
                    <div class="metric-icon indigo"><i class="bi bi-file-medical"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-total-consultas">—</div>
                        <div class="metric-label">Total consultas</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon blue"><i class="bi bi-calendar-check"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-ultima-consulta">—</div>
                        <div class="metric-label">Última consulta</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon green"><i class="bi bi-heart-pulse"></i></div>
                    <div class="metric-body">
                        <div class="metric-value" id="m-medico-frecuente">—</div>
                        <div class="metric-label">Médico más frecuente</div>
                    </div>
                </div>
            </section>

            <!-- Historial -->
            <div class="card" id="card-historial" style="display:none">
                <div class="card-head">
                    <h2 class="card-title"><i class="bi bi-clock-history" style="color:var(--purple)"></i> Historial de
                        consultas</h2>
                </div>
                <div id="lista-consultas" style="padding:16px 20px">
                    <div class="empty-row">Cargando...</div>
                </div>
            </div>

            <div class="card" id="card-vacio">
                <div class="empty-row" style="padding:60px 20px">
                    <i class="bi bi-person-search"
                        style="font-size:32px;display:block;margin-bottom:12px;color:var(--text-3)"></i>
                    Busca un paciente para ver su historial médico
                </div>
            </div>

        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/pacienteService.js"></script>
    <script src="/js/services/atencionService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/medico/historial-medico.js"></script>
</body>

</html>
