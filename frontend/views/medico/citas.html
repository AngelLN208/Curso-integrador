<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
</head>

<body>

    <div class="app-shell">
        <div id="sidebar-placeholder"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1 class="page-title">Mis citas</h1>
                    <p class="page-sub">Pacientes asignados a tu agenda</p>
                </div>
                <div class="topbar-right">
                    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                        <i class="bi bi-moon-stars" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Filtros -->
            <div class="card" style="margin-bottom:20px">
                <div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
                    <div>
                        <label class="form-label">Buscar paciente</label>
                        <input type="text" id="filtro-paciente" class="form-control" placeholder="Nombre o DNI...">
                    </div>
                    <div>
                        <label class="form-label">Fecha</label>
                        <input type="date" id="filtro-fecha" class="form-control">
                    </div>
                    <div>
                        <label class="form-label">Estado</label>
                        <select id="filtro-estado" class="form-control">
                            <option value="">Todos</option>
                            <option value="CONFIRMADA">Confirmada</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="ATENDIDA">Atendida</option>
                            <option value="CANCELADA">Cancelada</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card">
                <div class="card-head">
                    <h2 class="card-title">Lista de citas</h2>
                    <span class="metric-delta neutral" id="total-mostradas"></span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>DNI</th>
                                <th>Motivo</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-citas">
                            <tr>
                                <td colspan="7" class="empty-row">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Atender Paciente -->
    <div class="modal-backdrop" id="modalAtender">
        <div class="modal-box" style="max-width:600px">
            <div class="modal-header">
                <h3 class="modal-title"><i class="bi bi-clipboard2-pulse" style="color:var(--indigo)"></i> Atender
                    paciente</h3>
                <button class="modal-close" onclick="cerrarModal('modalAtender')"><i class="bi bi-x"></i></button>
            </div>
            <div class="modal-body">
                <div style="background:var(--bg-main);border-radius:12px;padding:14px;margin-bottom:16px">
                    <div style="font-weight:600;color:var(--text)" id="atender-paciente-nombre">—</div>
                    <div style="font-size:13px;color:var(--text-2);margin-top:2px" id="atender-info">—</div>
                </div>

                <!-- Paso 1: Triaje (formulario activo, solo en flujo de atención nueva) -->
                <div id="seccion-triaje">
                    <h4 style="font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;
                   letter-spacing:.05em;margin-bottom:10px">
                        <i class="bi bi-1-circle-fill" style="color:var(--indigo)"></i> Triaje
                    </h4>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
                        <div>
                            <label class="form-label">Presión arterial</label>
                            <input type="text" id="tri-presion" class="form-control" placeholder="120/80">
                        </div>
                        <div>
                            <label class="form-label">Temperatura (°C)</label>
                            <input type="number" id="tri-temperatura" class="form-control" placeholder="36.5"
                                step="0.1">
                        </div>
                        <div>
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" id="tri-peso" class="form-control" placeholder="70.0" step="0.1">
                        </div>
                    </div>
                    <button class="btn btn-indigo" onclick="guardarTriaje()" id="btn-guardar-triaje">
                        <i class="bi bi-check-lg"></i> Guardar triaje
                    </button>
                </div>

                <!-- Datos de triaje (visible al ver una atención ya registrada; editable según permisos) -->
                <div id="seccion-triaje-readonly" style="display:none;margin-bottom:16px">
                    <h4 style="font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;
                   letter-spacing:.05em;margin-bottom:10px">
                        <i class="bi bi-clipboard-pulse" style="color:var(--indigo)"></i> Triaje registrado
                    </h4>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
                        <div>
                            <label class="form-label">Presión arterial</label>
                            <input type="text" id="ver-presion" class="form-control" disabled>
                        </div>
                        <div>
                            <label class="form-label">Temperatura (°C)</label>
                            <input type="number" id="ver-temperatura" class="form-control" step="0.1" disabled>
                        </div>
                        <div>
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" id="ver-peso" class="form-control" step="0.1" disabled>
                        </div>
                    </div>
                </div>

                <!-- Paso 2: Consulta -->
                <div id="seccion-consulta"
                    style="display:none;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
                    <h4 style="font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;
                   letter-spacing:.05em;margin-bottom:10px">
                        <i class="bi bi-2-circle-fill" style="color:var(--green)"></i> Consulta médica
                    </h4>
                    <div class="field-group">
                        <label class="form-label">Diagnóstico *</label>
                        <textarea id="con-diagnostico" class="form-control" rows="2"
                            placeholder="Diagnóstico del paciente..."></textarea>
                    </div>
                    <div class="field-group">
                        <label class="form-label">Tratamiento *</label>
                        <textarea id="con-tratamiento" class="form-control" rows="2"
                            placeholder="Tratamiento indicado..."></textarea>
                    </div>
                    <div class="field-group">
                        <label class="form-label">Observaciones (opcional)</label>
                        <textarea id="con-observaciones" class="form-control" rows="2"
                            placeholder="Notas adicionales..."></textarea>
                    </div>
                    <div id="aviso-no-editable" style="display:none;background:var(--amber-lt);color:var(--amber);
             border-radius:10px;padding:10px 14px;font-size:12px;margin-top:8px">
                        <i class="bi bi-clock-history"></i> El tiempo para editar esta consulta ha expirado (45 min
                        desde la cita).
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="cerrarModal('modalAtender')">Cerrar</button>
                <button class="btn btn-blue" onclick="habilitarEdicion()" id="btn-editar-consulta" style="display:none">
                    <i class="bi bi-pencil"></i> Editar
                </button>
                <button class="btn btn-green" onclick="guardarEdicion()" id="btn-guardar-edicion" style="display:none">
                    <i class="bi bi-check-lg"></i> Guardar cambios
                </button>
                <button class="btn btn-green" onclick="finalizarConsulta()" id="btn-finalizar-consulta"
                    style="display:none">
                    <i class="bi bi-clipboard2-check"></i> Finalizar atención
                </button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/citaService.js"></script>
    <script src="/js/services/atencionService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/medico/citas.js"></script>
</body>

</html>
