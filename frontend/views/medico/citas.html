<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

    <div class="flex min-h-screen">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
            <div class="p-4 sm:p-6 lg:p-8">

                <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-display font-semibold text-xl lg:text-[22px] text-tinta dark:text-white">Mis
                            citas</h1>
                        <p class="text-[13px] text-neblina mt-1">Pacientes asignados a tu agenda</p>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button id="themeToggle" title="Cambiar tema"
                            class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
                            <i class="bi bi-moon-stars" id="theme-icon"></i>
                        </button>
                    </div>
                </header>

                <!-- Filtros -->
                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 sm:p-5 mb-5">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Buscar paciente</label>
                            <input type="text" id="filtro-paciente"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia"
                                placeholder="Nombre o DNI...">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Fecha</label>
                            <input type="date" id="filtro-fecha"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Estado</label>
                            <select id="filtro-estado"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia">
                                <option value="">Todos</option>
                                <option value="CONFIRMADA">Confirmada</option>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="ATENDIDA">Atendida</option>
                                <option value="CANCELADA">Cancelada</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Tabla -->
                <div
                    class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
                    <div
                        class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark">
                        <h2 class="font-display font-semibold text-[15px] text-tinta dark:text-white">Lista de citas
                        </h2>
                        <span
                            class="text-xs font-medium text-neblina bg-lienzo dark:bg-tinta-dark px-2.5 py-1 rounded-full"
                            id="total-mostradas"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[13px] min-w-[720px]">
                            <thead>
                                <tr class="bg-lienzo dark:bg-tinta-dark border-b border-borde dark:border-borde-dark">
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Fecha</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Hora</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Paciente</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        DNI</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Motivo</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Estado</th>
                                    <th
                                        class="px-4 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-neblina">
                                        Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-citas" class="divide-y divide-borde dark:divide-borde-dark">
                                <tr>
                                    <td colspan="7" class="text-center text-neblina py-10 text-[13px]">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Atender Paciente -->
    <div id="modalAtender"
        class="hidden fixed inset-0 z-50 bg-tinta/50 backdrop-blur-sm items-center justify-center p-4">
        <div
            class="bg-white dark:bg-superficie-dark rounded-card w-full max-w-[600px] max-h-[90vh] overflow-y-auto shadow-xl">
            <div
                class="flex items-center justify-between px-5 py-4 border-b border-borde dark:border-borde-dark sticky top-0 bg-white dark:bg-superficie-dark">
                <h3 class="font-display font-semibold text-[15px] text-tinta dark:text-white flex items-center gap-2">
                    <i class="bi bi-clipboard2-pulse text-guia"></i> Atender paciente
                </h3>
                <button onclick="cerrarModal('modalAtender')"
                    class="w-8 h-8 rounded-lg flex items-center justify-center text-neblina hover:bg-lienzo dark:hover:bg-tinta-dark transition-colors">
                    <i class="bi bi-x text-xl"></i>
                </button>
            </div>
            <div class="p-5">
                <div class="bg-lienzo dark:bg-tinta-dark rounded-lg p-3.5 mb-5">
                    <div class="font-medium text-[14px] text-tinta dark:text-white" id="atender-paciente-nombre">—
                    </div>
                    <div class="text-xs text-neblina mt-0.5" id="atender-info">—</div>
                </div>

                <!-- Paso 1: Triaje -->
                <div id="seccion-triaje">
                    <h4
                        class="text-[11px] font-semibold text-neblina uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="bi bi-1-circle-fill text-guia"></i> Triaje
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 mb-4">
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Presión arterial</label>
                            <input type="text" id="tri-presion"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia"
                                placeholder="120/80">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Temperatura (°C)</label>
                            <input type="number" id="tri-temperatura" step="0.1"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia"
                                placeholder="36.5">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Peso (kg)</label>
                            <input type="number" id="tri-peso" step="0.1"
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia"
                                placeholder="70.0">
                        </div>
                    </div>
                    <button onclick="guardarTriaje()" id="btn-guardar-triaje"
                        class="inline-flex items-center gap-1.5 bg-guia hover:bg-guia-dark text-white text-[13px] font-medium px-4 py-2 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="bi bi-check-lg"></i> Guardar triaje
                    </button>
                </div>

                <!-- Triaje ya registrado (solo lectura) -->
                <div id="seccion-triaje-readonly" class="hidden mb-4">
                    <h4
                        class="text-[11px] font-semibold text-neblina uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="bi bi-clipboard-pulse text-guia"></i> Triaje registrado
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Presión arterial</label>
                            <input type="text" id="ver-presion" disabled
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white disabled:opacity-70">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Temperatura (°C)</label>
                            <input type="number" id="ver-temperatura" step="0.1" disabled
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white disabled:opacity-70">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-neblina mb-1.5">Peso (kg)</label>
                            <input type="number" id="ver-peso" step="0.1" disabled
                                class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white disabled:opacity-70">
                        </div>
                    </div>
                </div>

                <!-- Paso 2: Consulta -->
                <div id="seccion-consulta" class="hidden mt-5 pt-4 border-t border-borde dark:border-borde-dark">
                    <h4
                        class="text-[11px] font-semibold text-neblina uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="bi bi-2-circle-fill text-rumbo"></i> Consulta médica
                    </h4>
                    <div class="mb-3.5">
                        <label class="block text-xs font-medium text-neblina mb-1.5">Diagnóstico *</label>
                        <textarea id="con-diagnostico" rows="2" placeholder="Diagnóstico del paciente..."
                            class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia resize-none disabled:opacity-70"></textarea>
                    </div>
                    <div class="mb-3.5">
                        <label class="block text-xs font-medium text-neblina mb-1.5">Tratamiento *</label>
                        <textarea id="con-tratamiento" rows="2" placeholder="Tratamiento indicado..."
                            class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia resize-none disabled:opacity-70"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-neblina mb-1.5">Observaciones
                            (opcional)</label>
                        <textarea id="con-observaciones" rows="2" placeholder="Notas adicionales..."
                            class="w-full bg-lienzo dark:bg-tinta-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-tinta dark:text-white placeholder:text-neblina focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia resize-none disabled:opacity-70"></textarea>
                    </div>
                    <div id="aviso-no-editable"
                        class="hidden mt-3 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 rounded-lg px-3.5 py-2.5 text-xs">
                        <i class="bi bi-clock-history mr-1"></i> El tiempo para editar esta consulta ha expirado (45
                        min desde la cita).
                    </div>
                </div>
            </div>
            <div
                class="flex items-center justify-end gap-2.5 px-5 py-4 border-t border-borde dark:border-borde-dark sticky bottom-0 bg-white dark:bg-superficie-dark">
                <button onclick="cerrarModal('modalAtender')"
                    class="text-[13px] font-medium text-neblina hover:text-tinta dark:hover:text-white px-4 py-2 rounded-lg transition-colors">
                    Cerrar
                </button>
                <button onclick="habilitarEdicion()" id="btn-editar-consulta"
                    class="hidden inline-flex items-center gap-1.5 bg-tinta hover:bg-tinta-light text-white text-[13px] font-medium px-4 py-2 rounded-lg transition-colors">
                    <i class="bi bi-pencil"></i> Editar
                </button>
                <button onclick="guardarEdicion()" id="btn-guardar-edicion"
                    class="hidden inline-flex items-center gap-1.5 bg-rumbo hover:bg-rumbo-dark text-white text-[13px] font-medium px-4 py-2 rounded-lg transition-colors">
                    <i class="bi bi-check-lg"></i> Guardar cambios
                </button>
                <button onclick="finalizarConsulta()" id="btn-finalizar-consulta"
                    class="hidden inline-flex items-center gap-1.5 bg-rumbo hover:bg-rumbo-dark text-white text-[13px] font-medium px-4 py-2 rounded-lg transition-colors">
                    <i class="bi bi-clipboard2-check"></i> Finalizar atención
                </button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/citaService.js"></script>
    <script src="/js/services/atencionService.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/sidebar.js"></script>
    <script src="/js/medico/citas.js"></script>
</body>

</html>
