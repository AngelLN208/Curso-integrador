<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Clínica Stella Maris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-lienzo dark:bg-lienzo-dark text-tinta dark:text-white transition-colors">

  <div class="flex min-h-screen">
    <div id="sidebar-placeholder"></div>

    <main class="flex-1 min-w-0 pt-14 lg:pt-0 bg-lienzo dark:bg-lienzo-dark">
      <div class="p-4 sm:p-6 lg:p-8">

        <header class="flex flex-wrap items-start justify-between gap-4 mb-6">
          <div>
            <h1 class="font-display font-semibold text-xl lg:text-[22px] text-tinta dark:text-white">Mi
              panel</h1>
            <p class="text-[13px] text-neblina mt-1" id="greeting">Resumen de tu día</p>
          </div>
          <div class="flex items-center gap-2.5">
            <div
              class="hidden sm:flex items-center gap-2 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg px-3.5 py-2 text-[13px] text-neblina">
              <i class="bi bi-calendar3"></i>
              <span id="fecha-hoy"></span>
            </div>
            <button id="themeToggle" title="Cambiar tema"
              class="w-9 h-9 bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-lg flex items-center justify-center text-neblina hover:text-guia hover:border-guia transition-colors flex-shrink-0">
              <i class="bi bi-moon-stars" id="theme-icon"></i>
            </button>
          </div>
        </header>

        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-guia/10 flex items-center justify-center text-guia text-xl flex-shrink-0">
              <i class="bi bi-calendar-day"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                id="m-citas-hoy">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Citas hoy</div>
            </div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center text-amber-600 dark:text-amber-400 text-xl flex-shrink-0">
              <i class="bi bi-hourglass-split"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                id="m-pendientes">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Pendientes por atender</div>
            </div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-tinta/10 dark:bg-tinta-light/20 flex items-center justify-center text-tinta dark:text-white text-xl flex-shrink-0">
              <i class="bi bi-clipboard-check"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                id="m-atendidas-mes">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Atendidas este mes</div>
            </div>
          </div>
          <div
            class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card p-4 flex items-center gap-3">
            <div
              class="w-11 h-11 rounded-lg bg-rumbo/10 flex items-center justify-center text-rumbo text-xl flex-shrink-0">
              <i class="bi bi-people"></i>
            </div>
            <div class="min-w-0">
              <div class="font-display text-xl lg:text-2xl font-semibold text-tinta dark:text-white leading-none"
                id="m-pacientes-mes">—</div>
              <div class="text-[11px] lg:text-xs text-neblina mt-1">Pacientes este mes</div>
            </div>
          </div>
        </section>

        <div
          class="bg-white dark:bg-superficie-dark border border-borde dark:border-borde-dark rounded-card overflow-hidden">
          <div
            class="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-borde dark:border-borde-dark">
            <h2 class="font-display font-semibold text-[15px] text-tinta dark:text-white">
              <i class="bi bi-calendar-event text-guia mr-1.5"></i> Mi agenda de hoy
            </h2>
            <a href="/views/medico/citas.html" class="text-xs text-guia font-medium hover:underline">Ver
              todas mis citas</a>
          </div>
          <div id="lista-citas-hoy" class="divide-y divide-borde dark:divide-borde-dark">
            <div class="text-center text-neblina py-10 text-[13px]">Cargando...</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/citaService.js"></script>
  <script src="/js/utils/ui.js"></script>
  <script src="/js/utils/sidebar.js"></script>
  <script src="/js/medico/dashboard.js"></script>
</body>

</html>
