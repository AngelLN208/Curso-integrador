<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-mesh-login min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" viewBox="0 0 900 560"
        preserveAspectRatio="none">
        <path d="M60 90 L140 150 L110 230" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="60" cy="90" r="2.5" fill="#6E7686" />
        <circle cx="140" cy="150" r="2" fill="#6E7686" />
        <circle cx="110" cy="230" r="2.5" fill="#6E7686" />
        <path d="M800 420 L830 460 L800 510" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="800" cy="420" r="2" fill="#6E7686" />
        <circle cx="830" cy="460" r="2.5" fill="#6E7686" />
        <circle cx="800" cy="510" r="2" fill="#6E7686" />
    </svg>

    <div
        class="relative w-full max-w-[420px] bg-white dark:bg-superficie-dark rounded-2xl overflow-hidden shadow-[0_24px_70px_rgba(20,33,61,0.2)] p-8">

        <!-- Vista: pedir correo -->
        <div id="vista-solicitar">
            <div class="flex items-center gap-2.5 mb-6">
                <i class="bi bi-compass text-guia text-2xl"></i>
                <span class="font-display font-bold text-base text-tinta dark:text-white">Stella Maris</span>
            </div>

            <div class="w-12 h-12 rounded-xl bg-guia/10 flex items-center justify-center mb-4">
                <i class="bi bi-key text-guia text-xl"></i>
            </div>

            <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-1.5">¿Olvidaste tu contraseña?
            </div>
            <p class="text-[13px] text-neblina mb-6">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

            <div id="error-msg"
                class="hidden items-center gap-2.5 bg-alerta/10 text-alerta text-sm font-medium rounded-lg px-4 py-3 mb-5">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="error-text"></span>
            </div>

            <form id="forgotForm" novalidate>
                <div class="mb-5">
                    <label class="block text-xs font-medium mb-1.5" for="correo">Correo electrónico</label>
                    <div class="relative">
                        <i
                            class="bi bi-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                        <input type="email" id="correo" placeholder="correo@clinica.pe" autocomplete="email" required
                            class="w-full pl-10 pr-4 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                    </div>
                </div>

                <button type="submit" id="btnEnviar"
                    class="w-full flex items-center justify-center gap-2 bg-guia text-white rounded-lg py-3 text-sm font-semibold hover:opacity-90 transition-opacity disabled:opacity-70 disabled:cursor-not-allowed">
                    <span class="btn-text">Enviar enlace</span>
                    <div
                        class="spinner hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin">
                    </div>
                </button>
            </form>

            <div class="text-center mt-5">
                <a href="/views/auth/login.html" class="text-xs font-medium text-guia hover:underline">
                    <i class="bi bi-arrow-left"></i> Volver a iniciar sesión
                </a>
            </div>
        </div>

        <!-- Vista: confirmación de envío -->
        <div id="vista-enviado" class="hidden text-center">
            <div class="w-14 h-14 rounded-full bg-rumbo/10 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-envelope-check text-rumbo text-2xl"></i>
            </div>
            <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-2">Revisa tu correo</div>
            <p class="text-[13px] text-neblina mb-6 leading-relaxed">
                Si el correo <strong id="correo-enviado" class="text-tinta dark:text-white"></strong> está registrado,
                te llegará un enlace para restablecer tu contraseña en los próximos minutos.
            </p>
            <a href="/views/auth/login.html"
                class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-lienzo dark:bg-tinta-dark text-tinta dark:text-white hover:opacity-80 transition-opacity">
                <i class="bi bi-arrow-left"></i> Volver a iniciar sesión
            </a>
        </div>

    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/auth/forgot-password.js"></script>
</body>

</html>
