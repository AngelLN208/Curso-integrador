<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-mesh-login min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" viewBox="0 0 900 560"
        preserveAspectRatio="none">
        <path d="M60 90 L140 150 L110 230" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="60" cy="90" r="2.5" fill="#6E7686" />
        <circle cx="140" cy="150" r="2" fill="#6E7686" />
        <circle cx="110" cy="230" r="2.5" fill="#6E7686" />
        <path d="M800 420 L830 460 L800 510" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="800" cy="420" r="2" fill="#6E7686" />
        <circle cx="830" cy="460" r="2.5" fill="#6E7686" />
        <circle cx="800" cy="510" r="2" fill="#6E7686" />
    </svg>

    <div
        class="relative w-full max-w-[420px] bg-white dark:bg-superficie-dark rounded-2xl overflow-hidden shadow-[0_24px_70px_rgba(20,33,61,0.2)] p-8">

        <!-- Vista: formulario de nueva contraseña -->
        <div id="vista-formulario">
            <div class="flex items-center gap-2.5 mb-6">
                <i class="bi bi-compass text-guia text-2xl"></i>
                <span class="font-display font-bold text-base text-tinta dark:text-white">Stella Maris</span>
            </div>

            <div class="w-12 h-12 rounded-xl bg-guia/10 flex items-center justify-center mb-4">
                <i class="bi bi-shield-lock text-guia text-xl"></i>
            </div>

            <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-1.5">Crea una nueva contraseña
            </div>
            <p class="text-[13px] text-neblina mb-6">Debe tener al menos 6 caracteres.</p>

            <div id="error-msg"
                class="hidden items-center gap-2.5 bg-alerta/10 text-alerta text-sm font-medium rounded-lg px-4 py-3 mb-5">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="error-text"></span>
            </div>

            <form id="resetForm" novalidate>
                <div class="mb-4">
                    <label class="block text-xs font-medium mb-1.5" for="nuevaPassword">Nueva contraseña</label>
                    <div class="relative">
                        <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                        <input type="password" id="nuevaPassword" placeholder="••••••••" autocomplete="new-password"
                            required
                            class="w-full pl-10 pr-10 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                        <button type="button" id="toggle1"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center justify-center text-neblina p-1">
                            <i class="bi bi-eye" id="toggle-icon1"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-xs font-medium mb-1.5" for="confirmarPassword">Confirmar contraseña</label>
                    <div class="relative">
                        <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                        <input type="password" id="confirmarPassword" placeholder="••••••••" autocomplete="new-password"
                            required
                            class="w-full pl-10 pr-10 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                        <button type="button" id="toggle2"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center justify-center text-neblina p-1">
                            <i class="bi bi-eye" id="toggle-icon2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnRestablecer"
                    class="w-full flex items-center justify-center gap-2 bg-guia text-white rounded-lg py-3 text-sm font-semibold hover:opacity-90 transition-opacity disabled:opacity-70 disabled:cursor-not-allowed">
                    <span class="btn-text">Restablecer contraseña</span>
                    <div
                        class="spinner hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin">
                    </div>
                </button>
            </form>
        </div>

        <!-- Vista: éxito -->
        <div id="vista-exito" class="hidden text-center">
            <div class="w-14 h-14 rounded-full bg-rumbo/10 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-check-circle text-rumbo text-2xl"></i>
            </div>
            <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-2">¡Listo!</div>
            <p class="text-[13px] text-neblina mb-6">Tu contraseña fue restablecida correctamente.</p>
            <a href="/views/auth/login.html"
                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity">
                Iniciar sesión
            </a>
        </div>

        <!-- Vista: token inválido -->
        <div id="vista-invalido" class="hidden text-center">
            <div class="w-14 h-14 rounded-full bg-alerta/10 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-exclamation-triangle text-alerta text-2xl"></i>
            </div>
            <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-2">Enlace no válido</div>
            <p class="text-[13px] text-neblina mb-6">Este enlace es incorrecto, ya expiró o ya fue utilizado.</p>
            <a href="/views/auth/forgot-password.html"
                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold bg-guia text-white hover:opacity-90 transition-opacity">
                Solicitar uno nuevo
            </a>
        </div>

    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/auth/reset-password.js"></script>
</body>

</html>
