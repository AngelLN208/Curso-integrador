<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="font-sans bg-mesh-login min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Mini constelaciones decorativas en el fondo -->
    <svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" viewBox="0 0 900 560"
        preserveAspectRatio="none">
        <path d="M60 90 L140 150 L110 230" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="60" cy="90" r="2.5" fill="#6E7686" />
        <circle cx="140" cy="150" r="2" fill="#6E7686" />
        <circle cx="110" cy="230" r="2.5" fill="#6E7686" />
        <path d="M800 420 L830 460 L800 510" fill="none" stroke="#8891A0" stroke-width="1" stroke-dasharray="3 5" />
        <circle cx="800" cy="420" r="2" fill="#6E7686" />
        <circle cx="830" cy="460" r="2.5" fill="#6E7686" />
        <circle cx="800" cy="510" r="2" fill="#6E7686" />
    </svg>

    <div
        class="relative w-full max-w-[880px] bg-white dark:bg-superficie-dark rounded-2xl overflow-hidden flex flex-col lg:flex-row shadow-[0_24px_70px_rgba(20,33,61,0.2)]">

        <!-- Panel decorativo -->
        <div
            class="lg:w-[42%] bg-tinta-dark px-8 py-8 lg:py-10 flex flex-col justify-between relative overflow-hidden flex-shrink-0">

            <svg viewBox="0 0 320 460" class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <radialGradient id="loginGlow" cx="50%" cy="45%" r="55%">
                        <stop offset="0%" stop-color="#FF7A45" stop-opacity="0.28" />
                        <stop offset="100%" stop-color="#FF7A45" stop-opacity="0" />
                    </radialGradient>
                </defs>
                <circle cx="160" cy="230" r="150" fill="url(#loginGlow)" />
                <circle cx="160" cy="230" r="95" fill="none" stroke="#2A3350" stroke-width="1" stroke-dasharray="2 6" />
                <circle cx="160" cy="230" r="140" fill="none" stroke="#2A3350" stroke-width="1"
                    stroke-dasharray="2 6" />
                <path d="M160 135 L200 210 L160 325 L120 210 Z" fill="none" stroke="#FF9B72" stroke-width="1.5" />
                <circle cx="160" cy="230" r="5" fill="#FF7A45" />
                <circle cx="160" cy="135" r="3.5" fill="#F0F2F6" />
                <circle cx="255" cy="230" r="3.5" fill="#F0F2F6" />
                <circle cx="160" cy="325" r="3.5" fill="#F0F2F6" />
                <circle cx="65" cy="230" r="3.5" fill="#F0F2F6" />
                <circle cx="95" cy="150" r="2.5" fill="#4CC793" />
                <circle cx="230" cy="300" r="2.5" fill="#4CC793" />
                <circle cx="225" cy="145" r="2" fill="#F0F2F6" opacity="0.6" />
                <circle cx="80" cy="310" r="2" fill="#F0F2F6" opacity="0.5" />
                <circle cx="45" cy="80" r="1.5" fill="#F0F2F6" opacity="0.4" />
                <circle cx="280" cy="60" r="1.5" fill="#F0F2F6" opacity="0.4" />
                <circle cx="270" cy="400" r="1.5" fill="#F0F2F6" opacity="0.4" />
                <circle cx="30" cy="380" r="1.5" fill="#F0F2F6" opacity="0.3" />
            </svg>

            <div class="relative flex items-center gap-2.5">
                <i class="bi bi-compass text-guia-light text-2xl"></i>
                <span class="font-display font-bold text-base text-white">Stella Maris</span>
            </div>

            <div class="relative my-6 lg:my-0">
                <div class="font-display font-semibold text-xl lg:text-2xl text-white leading-snug mb-2.5">
                    Tu guía en cada consulta
                </div>
                <p class="text-[13px] text-neblina leading-relaxed max-w-[220px]">
                    Gestiona citas, pacientes y atención médica desde un solo lugar.
                </p>
            </div>

            <div class="relative hidden lg:flex items-center gap-0">
                <div class="w-2 h-2 rounded-full bg-guia-dark"></div>
                <div class="w-8 h-0.5 bg-white/10"></div>
                <div class="w-2 h-2 rounded-full bg-white/10"></div>
                <div class="w-8 h-0.5 bg-white/10"></div>
                <div class="w-2 h-2 rounded-full bg-white/10"></div>
            </div>
        </div>

        <!-- Panel del formulario -->
        <div class="flex-1 flex items-center justify-center px-6 py-8 lg:p-10">
            <div class="w-full max-w-[320px]">

                <div class="font-display font-semibold text-xl text-tinta dark:text-white mb-1.5">Bienvenido de vuelta
                </div>
                <p class="text-[13px] text-neblina mb-6">Ingresa tus credenciales para acceder al sistema</p>

                <div id="error-msg"
                    class="hidden items-center gap-2.5 bg-alerta/10 text-alerta text-sm font-medium rounded-lg px-4 py-3 mb-5">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="error-text">Credenciales incorrectas</span>
                </div>

                <form id="loginForm" novalidate>

                    <div class="mb-4">
                        <label class="block text-xs font-medium mb-1.5" for="email">Correo electrónico</label>
                        <div class="relative">
                            <i
                                class="bi bi-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                            <input type="email" id="email" placeholder="correo@clinica.pe" autocomplete="email" required
                                class="w-full pl-10 pr-4 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="block text-xs font-medium mb-1.5" for="password">Contraseña</label>
                        <div class="relative">
                            <i
                                class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-neblina text-[15px]"></i>
                            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
                                required
                                class="w-full pl-10 pr-10 py-2.5 border border-borde dark:border-borde-dark rounded-lg text-sm bg-white dark:bg-tinta-dark outline-none focus:border-guia focus:ring-2 focus:ring-guia/20 transition-colors placeholder:text-neblina/60">
                            <button type="button" id="togglePassword" aria-label="Mostrar contraseña"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center justify-center text-neblina p-1">
                                <i class="bi bi-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-right mb-5">
                        <a href="/views/auth/forgot-password.html"
                            class="text-xs font-medium text-guia hover:underline">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" id="btnLogin"
                        class="w-full flex items-center justify-center gap-2 bg-guia text-white rounded-lg py-3 text-sm font-semibold hover:opacity-90 transition-opacity disabled:opacity-70 disabled:cursor-not-allowed">
                        <span class="btn-text">Iniciar sesión</span>
                        <div
                            class="spinner hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin">
                        </div>
                    </button>

                </form>

            </div>
        </div>

    </div>

    <script src="/js/config.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/auth/login.js"></script>
</body>

</html>
