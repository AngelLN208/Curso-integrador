<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>

    <div class="auth-shell">
        <div class="auth-card" style="max-width:560px">
            <div class="auth-header">
                <div class="portal-logo-icon">🏥</div>
                <div class="auth-title">Crea tu cuenta</div>
                <div class="auth-sub">Regístrate para agendar y gestionar tus citas médicas</div>
            </div>

            <form id="form-registro" onsubmit="manejarRegistro(event)">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Nombres</label>
                        <input type="text" id="reg-nombres" class="form-control" placeholder="Juan Carlos" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Apellidos</label>
                        <input type="text" id="reg-apellidos" class="form-control" placeholder="Pérez Gómez" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">DNI</label>
                        <input type="text" id="reg-dni" class="form-control" placeholder="12345678" maxlength="8"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" id="reg-fecha" class="form-control" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Celular</label>
                        <input type="text" id="reg-celular" class="form-control" placeholder="999888777" maxlength="9"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sexo</label>
                        <select id="reg-sexo" class="form-control" required>
                            <option value="">Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="reg-correo" class="form-control" placeholder="tu@correo.com" required>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <div class="password-wrap">
                            <input type="password" id="reg-password" class="form-control" placeholder="••••••••"
                                required style="padding-right:40px" oninput="validarRequisitosPassword()">
                            <button type="button" class="password-toggle"
                                onclick="togglePass('reg-password','icon-reg-pass')">
                                <i class="bi bi-eye" id="icon-reg-pass"></i>
                            </button>
                        </div>
                        <div id="lista-requisitos" style="margin-top:8px;display:flex;flex-direction:column;gap:3px">
                            <div class="req-item" data-req="length" style="font-size:11.5px;color:var(--text-3)">
                                <i class="bi bi-circle"></i> 8 a 20 caracteres
                            </div>
                            <div class="req-item" data-req="mixed" style="font-size:11.5px;color:var(--text-3)">
                                <i class="bi bi-circle"></i> Una mayúscula y una minúscula
                            </div>
                            <div class="req-item" data-req="number" style="font-size:11.5px;color:var(--text-3)">
                                <i class="bi bi-circle"></i> Un número
                            </div>
                            <div class="req-item" data-req="special" style="font-size:11.5px;color:var(--text-3)">
                                <i class="bi bi-circle"></i> Un carácter especial (@$!%*?&)
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmar contraseña</label>
                        <div class="password-wrap">
                            <input type="password" id="reg-password2" class="form-control" placeholder="••••••••"
                                required style="padding-right:40px">
                            <button type="button" class="password-toggle"
                                onclick="togglePass('reg-password2','icon-reg-pass2')">
                                <i class="bi bi-eye" id="icon-reg-pass2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-registro">
                    <i class="bi bi-person-plus"></i> Crear cuenta
                </button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/utils/password-toggle.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/auth/registro.js"></script>
</body>

</html>
