<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <div class="portal-logo-icon">🔐</div>
                <div class="auth-title">Recuperar contraseña</div>
                <div class="auth-sub">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña</div>
            </div>

            <div id="form-recuperar">
                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="recuperar-correo" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <button class="btn btn-primary btn-block" onclick="solicitarRecuperacion()" id="btn-recuperar">
                    <i class="bi bi-envelope"></i> Enviar enlace de recuperación
                </button>
            </div>

            <div id="mensaje-enviado" style="display:none;text-align:center;padding:20px 0">
                <div style="font-size:40px;margin-bottom:12px">📬</div>
                <div style="font-weight:700;font-size:15px;margin-bottom:8px">¡Correo enviado!</div>
                <div style="font-size:13px;color:var(--text-2)">
                    Si tu correo está registrado, recibirás un enlace en los próximos minutos.
                    Revisa también tu carpeta de spam.
                </div>
            </div>

            <div class="auth-footer">
                <a href="login.html">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/portalService.js"></script>
    <script>
        async function solicitarRecuperacion() {
            const correo = document.getElementById('recuperar-correo').value.trim();
            if (!correo) return PortalNotify.error('Ingresa tu correo electrónico');

            const btn = document.getElementById('btn-recuperar');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Enviando...';

            try {
                await portalFetch('/portal/auth/recuperar-password', {
                    method: 'POST',
                    body: JSON.stringify({ correo })
                });

                document.getElementById('form-recuperar').style.display = 'none';
                document.getElementById('mensaje-enviado').style.display = 'block';

            } catch (err) {
                PortalNotify.error(err.message || 'No se pudo procesar la solicitud');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-envelope"></i> Enviar enlace de recuperación';
            }
        }
    </script>
</body>

</html>
