<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <div class="portal-logo-icon">🔑</div>
                <div class="auth-title">Nueva contraseña</div>
                <div class="auth-sub">Ingresa y confirma tu nueva contraseña</div>
            </div>

            <div id="form-reset">
                <div class="form-group">
                    <label class="form-label">Nueva contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="reset-password" class="form-control"
                            placeholder="Mínimo 6 caracteres" style="padding-right:40px">
                        <button type="button" class="password-toggle"
                            onclick="togglePass('reset-password','icon-reset-pass')">
                            <i class="bi bi-eye" id="icon-reset-pass"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar nueva contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="reset-password-confirm" class="form-control"
                            placeholder="Repite la nueva contraseña" style="padding-right:40px">
                        <button type="button" class="password-toggle"
                            onclick="togglePass('reset-password-confirm','icon-reset-confirm')">
                            <i class="bi bi-eye" id="icon-reset-confirm"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="resetearPassword()" id="btn-reset">
                    <i class="bi bi-shield-check"></i> Establecer nueva contraseña
                </button>
            </div>

            <div id="reset-exitoso" style="display:none;text-align:center;padding:20px 0">
                <div style="font-size:40px;margin-bottom:12px">✅</div>
                <div style="font-weight:700;font-size:15px;margin-bottom:8px">¡Contraseña actualizada!</div>
                <div style="font-size:13px;color:var(--text-2);margin-bottom:20px">
                    Tu contraseña ha sido restablecida correctamente.
                </div>
                <a href="login.html" class="btn btn-primary btn-block">
                    <i class="bi bi-box-arrow-in-right"></i> Ir al inicio de sesión
                </a>
            </div>

            <div id="token-invalido" style="display:none;text-align:center;padding:20px 0">
                <div style="font-size:40px;margin-bottom:12px">❌</div>
                <div style="font-weight:700;font-size:15px;margin-bottom:8px">Enlace inválido o expirado</div>
                <div style="font-size:13px;color:var(--text-2);margin-bottom:20px">
                    El enlace de recuperación no es válido o ha expirado (30 minutos).
                </div>
                <a href="recuperar-password.html" class="btn btn-primary btn-block">
                    Solicitar nuevo enlace
                </a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/utils/password-toggle.js"></script>
    <script src="../js/services/api.js"></script>

    <script>
        // Extraer el token de la URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('form-reset').style.display = 'none';
            document.getElementById('token-invalido').style.display = 'block';
        }

        async function resetearPassword() {
            const nuevaPassword = document.getElementById('reset-password').value;
            const confirmar = document.getElementById('reset-password-confirm').value;

            if (nuevaPassword.length < 6) {
                return PortalNotify.error('La contraseña debe tener al menos 6 caracteres');
            }
            if (nuevaPassword !== confirmar) {
                return PortalNotify.error('Las contraseñas no coinciden');
            }

            const btn = document.getElementById('btn-reset');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Procesando...';

            try {
                await portalFetch('/portal/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        token,
                        nuevaPassword,
                        confirmarPassword: confirmar
                    })
                });

                document.getElementById('form-reset').style.display = 'none';
                document.getElementById('reset-exitoso').style.display = 'block';

            } catch (err) {
                if (err.message?.includes('expirado') || err.message?.includes('válido')) {
                    document.getElementById('form-reset').style.display = 'none';
                    document.getElementById('token-invalido').style.display = 'block';
                } else {
                    PortalNotify.error(err.message || 'No se pudo restablecer la contraseña');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-shield-check"></i> Establecer nueva contraseña';
                }
            }
        }
    </script>
</body>

</html>
