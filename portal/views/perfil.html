<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>

    <header class="portal-topbar">
        <a href="dashboard.html" class="portal-logo">
            <div class="portal-logo-icon">🏥</div>
            <div class="portal-logo-text">Clínica <span>Stella Maris</span></div>
        </a>
        <nav class="portal-nav">
            <a href="dashboard.html">Mi panel</a>
            <a href="directorio.html">Médicos</a>
            <a href="citas.html">Mis citas</a>
            <a href="chatbot.html">Asistente</a>
        </nav>
        <div style="display:flex;align-items:center;gap:10px">
            <a href="perfil.html" class="btn btn-ghost btn-sm" style="text-decoration:none">
                <i class="bi bi-person-circle"></i>
            </a>
            <span style="font-size:13px;color:var(--text-2)" id="saludo-usuario"></span>
            <button class="btn btn-ghost btn-sm" onclick="PortalAuthService.logout()">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </header>

    <div class="container" style="max-width:640px">

        <div style="margin-bottom:24px">
            <h1 style="font-size:24px;font-weight:800">Mi perfil</h1>
            <p style="color:var(--text-2);font-size:14px">Actualiza tu información personal</p>
        </div>

        <div class="card card-pad">
            <div id="perfil-loading" class="empty-row">Cargando tu información...</div>

            <form id="form-perfil" style="display:none">

                <div class="form-group">
                    <label class="form-label">DNI</label>
                    <input type="text" id="perfil-dni" class="form-control" disabled
                        style="background:var(--bg-soft);color:var(--text-3)">
                    <span style="font-size:11.5px;color:var(--text-3)">El DNI no puede modificarse</span>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                    <div class="form-group">
                        <label class="form-label">Nombres</label>
                        <input type="text" id="perfil-nombres" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Apellidos</label>
                        <input type="text" id="perfil-apellidos" class="form-control" required>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                    <div class="form-group">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" id="perfil-fecha-nacimiento" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sexo</label>
                        <select id="perfil-sexo" class="form-control" required>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Celular</label>
                    <input type="text" id="perfil-celular" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="perfil-correo" class="form-control" required>
                    <span style="font-size:11.5px;color:var(--amber)">
                        <i class="bi bi-exclamation-triangle"></i> Si cambias tu correo, deberás iniciar sesión de nuevo
                        con el nuevo correo
                    </span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-guardar-perfil">
                    <i class="bi bi-check-circle"></i> Guardar cambios
                </button>
            </form>
        </div>

        <!-- Seguros vinculados (solo lectura) -->
        <div class="card" style="margin-top:18px" id="card-seguros" style="display:none">
            <div
                style="padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
                <i class="bi bi-shield-check" style="color:var(--primary)"></i>
                <span style="font-weight:700;font-size:14.5px">Mis seguros</span>
            </div>
            <div class="card-pad" id="lista-seguros">
                <div class="empty-row">Cargando...</div>
            </div>
        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/portalService.js"></script>
    <script src="../js/perfil.js"></script>
</body>

</html>
