<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>

    <header class="portal-topbar">
        <a href="dashboard.html" class="portal-logo">
            <div class="portal-logo-icon">🏥</div>
            <div class="portal-logo-text">Clínica <span>Stella Maris</span></div>
        </a>
        <nav class="portal-nav">
            <a href="dashboard.html">Mi panel</a>
            <a href="directorio.html" class="active">Médicos</a>
            <a href="citas.html">Mis citas</a>
            <a href="chatbot.html">Asistente</a>
        </nav>
        <div style="display:flex;align-items:center;gap:10px">
            <a href="perfil.html" class="btn btn-ghost btn-sm" style="text-decoration:none" title="Mi perfil">
                <i class="bi bi-person-circle"></i>
            </a>
            <span style="font-size:13px;color:var(--text-2)" id="saludo-usuario"></span>
            <button class="btn btn-ghost btn-sm" onclick="PortalAuthService.logout()">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </header>

    <div class="container">

        <div style="margin-bottom:24px">
            <h1 style="font-size:24px;font-weight:800">Encuentra a tu médico</h1>
            <p style="color:var(--text-2);font-size:14px">Explora especialidades y agenda tu cita con el especialista
                que necesitas</p>
        </div>

        <!-- Filtros de búsqueda -->
        <div class="card"
            style="padding:16px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
            <div class="form-group" style="margin:0;flex:1 1 220px">
                <label class="form-label" style="font-size:12px">Buscar por nombre o apellido</label>
                <input type="text" id="filtro-texto" class="form-control" placeholder="Ej: Carlos López"
                    oninput="aplicarFiltros()">
            </div>
            <div class="form-group" style="margin:0;flex:1 1 160px">
                <label class="form-label" style="font-size:12px">Día de atención</label>
                <select id="filtro-dia" class="form-control" onchange="aplicarFiltros()">
                    <option value="">Todos los días</option>
                    <option value="MONDAY">Lunes</option>
                    <option value="TUESDAY">Martes</option>
                    <option value="WEDNESDAY">Miércoles</option>
                    <option value="THURSDAY">Jueves</option>
                    <option value="FRIDAY">Viernes</option>
                    <option value="SATURDAY">Sábado</option>
                    <option value="SUNDAY">Domingo</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;flex:1 1 160px">
                <label class="form-label" style="font-size:12px">Disponible en fecha</label>
                <input type="date" id="filtro-fecha" class="form-control" onchange="aplicarFiltros()">
            </div>
            <button class="btn btn-ghost btn-sm" onclick="limpiarFiltros()" style="height:38px">
                <i class="bi bi-x-circle"></i> Limpiar
            </button>
        </div>

        <!-- Filtro por especialidad -->
        <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px"
            id="filtros-especialidad">
            <button class="btn btn-primary btn-sm" data-esp="" onclick="filtrarPorEspecialidad('', this)">
                <i class="bi bi-grid"></i> Todas
            </button>
        </div>

        <!-- Lista de médicos -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px" id="grid-medicos">
            <div class="empty-row" style="grid-column:1/-1">Cargando médicos...</div>
        </div>

    </div>

    <!-- Modal Agendar Cita -->
    <div class="modal-backdrop-portal" id="modalAgendar" style="display:none;position:fixed;inset:0;
     background:rgba(15,23,42,.5);z-index:200;align-items:center;justify-content:center;padding:20px">
        <div class="card" style="max-width:520px;width:100%;max-height:88vh;overflow-y:auto">
            <div
                style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
                <h3 style="font-size:16px;font-weight:700">Agendar cita</h3>
                <button onclick="cerrarModalAgendar()"
                    style="background:none;border:none;font-size:20px;color:var(--text-3);cursor:pointer">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div style="padding:24px">
                <div style="background:var(--primary-lt);border-radius:12px;padding:14px;margin-bottom:18px">
                    <div style="font-weight:700;color:var(--text)" id="agendar-medico-nombre">—</div>
                    <div style="font-size:13px;color:var(--text-2)" id="agendar-medico-especialidad">—</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha</label>
                    <input type="date" id="agendar-fecha" class="form-control" onchange="cargarSlotsDisponibles()">
                </div>

                <div class="form-group">
                    <label class="form-label">Horario disponible</label>
                    <div id="agendar-slots" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
                        <span style="font-size:13px;color:var(--text-3)">Selecciona una fecha primero</span>
                    </div>
                    <input type="hidden" id="agendar-fechahora-elegida">
                </div>

                <div class="form-group">
                    <label class="form-label">Motivo de consulta (opcional)</label>
                    <textarea id="agendar-motivo" class="form-control" rows="2"
                        placeholder="Describe brevemente el motivo..."></textarea>
                </div>

                <button class="btn btn-primary btn-block" onclick="confirmarAgendarCita()" id="btn-confirmar-cita">
                    <i class="bi bi-calendar-check"></i> Confirmar cita
                </button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/portalService.js"></script>
    <script src="../js/directorio.js"></script>
</body>

</html>
