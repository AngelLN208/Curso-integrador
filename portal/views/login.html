<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>

<body>

    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <div class="portal-logo-icon">🏥</div>
                <div class="auth-title">Bienvenido de nuevo</div>
                <div class="auth-sub">Inicia sesión para gestionar tus citas en Clínica Stella Maris</div>
            </div>

            <form id="form-login" onsubmit="manejarLogin(event)">
                <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="login-correo" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required
                            style="padding-right:40px">
                        <button type="button" class="password-toggle"
                            onclick="togglePass('login-password','icon-login-pass')">
                            <i class="bi bi-eye" id="icon-login-pass"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px" id="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </button>
            </form>

            <div class="auth-footer">
                ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/utils/password-toggle.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/auth/login.js"></script>
</body>

</html>
