<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Clínica Stella Maris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/tailwind.css">
</head>

<body class="font-sans text-tinta transition-colors min-h-screen">

    <div
        class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-gradient-to-b from-tinta via-tinta-light to-tinta">

        <!-- Cielo estrellado: estrellas dispersas -->
        <svg class="pointer-events-none absolute inset-0 w-full h-full" viewBox="0 0 800 600"
            preserveAspectRatio="xMidYMid slice">
            <circle cx="60" cy="70" r="1.3" fill="white" opacity="0.7" />
            <circle cx="140" cy="40" r="0.9" fill="white" opacity="0.5" />
            <circle cx="230" cy="90" r="1.1" fill="white" opacity="0.6" />
            <circle cx="310" cy="30" r="0.8" fill="white" opacity="0.4" />
            <circle cx="90" cy="160" r="1" fill="white" opacity="0.5" />
            <circle cx="700" cy="60" r="1.4" fill="white" opacity="0.7" />
            <circle cx="640" cy="120" r="0.9" fill="white" opacity="0.5" />
            <circle cx="750" cy="150" r="1.1" fill="white" opacity="0.6" />
            <circle cx="580" cy="50" r="0.8" fill="white" opacity="0.4" />
            <circle cx="20" cy="480" r="1.2" fill="white" opacity="0.6" />
            <circle cx="70" cy="540" r="0.9" fill="white" opacity="0.5" />
            <circle cx="140" cy="500" r="1" fill="white" opacity="0.5" />
            <circle cx="730" cy="500" r="1.3" fill="white" opacity="0.7" />
            <circle cx="670" cy="560" r="0.9" fill="white" opacity="0.5" />
            <circle cx="600" cy="520" r="1.1" fill="white" opacity="0.6" />
            <circle cx="400" cy="20" r="0.9" fill="white" opacity="0.4" />
            <circle cx="450" cy="550" r="1" fill="white" opacity="0.5" />
            <circle cx="200" cy="550" r="0.8" fill="white" opacity="0.4" />
            <circle cx="550" cy="580" r="0.9" fill="white" opacity="0.4" />
            <circle cx="30" cy="300" r="0.9" fill="white" opacity="0.4" />
            <circle cx="770" cy="320" r="1" fill="white" opacity="0.5" />

            <!-- Constelación principal: la "Estrella Guía" -->
            <g opacity="0.55">
                <circle cx="120" cy="120" r="2" fill="#FF7A45" />
                <circle cx="200" cy="180" r="1.6" fill="white" />
                <circle cx="160" cy="250" r="1.8" fill="white" />
                <circle cx="260" cy="230" r="1.6" fill="white" />
                <circle cx="230" cy="310" r="2" fill="#FF7A45" />
                <path d="M120 120 L200 180 L160 250 L260 230 L230 310" stroke="white" stroke-width="0.8" fill="none"
                    opacity="0.5" />
            </g>

            <!-- Constelación secundaria, esquina inferior derecha -->
            <g opacity="0.45">
                <circle cx="600" cy="420" r="1.8" fill="#2F9E6E" />
                <circle cx="670" cy="460" r="1.4" fill="white" />
                <circle cx="650" cy="380" r="1.6" fill="white" />
                <circle cx="720" cy="400" r="1.8" fill="#2F9E6E" />
                <path d="M600 420 L650 380 L720 400 M650 380 L670 460" stroke="white" stroke-width="0.8" fill="none"
                    opacity="0.5" />
            </g>
        </svg>

        <div class="w-full max-w-md relative">

            <div class="bg-[#FFFDF9] border border-white/10 rounded-2xl shadow-2xl shadow-black/40 overflow-hidden">

                <!-- Header con cielo + logo -->
                <!-- Header con cielo + logo -->
                <div
                    class="bg-gradient-to-br from-tinta to-tinta-light px-8 pt-6 pb-12 text-center relative overflow-hidden">
                    <svg class="pointer-events-none absolute inset-0 w-full h-full opacity-60" viewBox="0 0 300 150">
                        <circle cx="40" cy="20" r="1" fill="white" opacity="0.6" />
                        <circle cx="90" cy="40" r="0.8" fill="white" opacity="0.4" />
                        <circle cx="250" cy="25" r="1" fill="white" opacity="0.6" />
                        <circle cx="200" cy="15" r="0.7" fill="white" opacity="0.4" />
                        <circle cx="270" cy="60" r="0.9" fill="white" opacity="0.5" />
                    </svg>
                    <img src="../img/stella-maris-logo.png" alt="Clínica Stella Maris"
                        class="relative mx-auto h-32 w-auto object-contain">
                    <p class="relative text-[13px] text-white/70 -mt-1">Inicia sesión para gestionar tus citas</p>
                </div>

                <!-- Form, superpuesto ligeramente sobre el header -->
                <div class="px-8 sm:px-10 pb-8 sm:pb-10 -mt-6">
                    <form id="form-login" onsubmit="manejarLogin(event); return false;"
                        class="bg-white rounded-xl p-5 sm:p-6 shadow-lg shadow-tinta/[0.1] border border-borde space-y-4">

                        <div>
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-neblina mb-1.5">
                                Correo electrónico
                            </label>
                            <input type="email" id="login-correo" required placeholder="tu@correo.com"
                                class="w-full rounded-xl border border-borde bg-lienzo px-4 py-3 text-sm text-tinta placeholder:text-neblina/60 focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia transition">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-neblina mb-1.5">
                                Contraseña
                            </label>
                            <div class="relative">
                                <input type="password" id="login-password" required placeholder="••••••••"
                                    class="w-full rounded-xl border border-borde bg-lienzo px-4 py-3 pr-11 text-sm text-tinta placeholder:text-neblina/60 focus:outline-none focus:ring-2 focus:ring-guia/40 focus:border-guia transition">
                                <button type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-neblina hover:text-tinta transition"
                                    onclick="togglePass('login-password','icon-login-pass')">
                                    <i class="bi bi-eye" id="icon-login-pass"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="btn-login"
                            class="w-full bg-guia hover:bg-guia/90 text-white font-semibold text-sm rounded-xl py-3 transition disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-1">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                        </button>

                        <div class="text-center pt-1">
                            <a href="recuperar-password.html" class="text-xs text-neblina hover:text-guia transition">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>
                    </form>

                    <div class="auth-footer text-center text-sm text-neblina mt-5 transition-all">
                        ¿Aún no tienes cuenta?
                        <a href="registro.html" class="text-guia font-semibold hover:underline">Regístrate aquí</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/utils/password-toggle.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/auth/login.js"></script>
</body>

</html>
