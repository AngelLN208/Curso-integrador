# ============================================================
# CONFIGURACIÓN GENERAL - Clínica Stella Maris
# Sistema de Gestión de Citas Médicas
# ============================================================

# Nombre y puerto de la aplicación
spring.application.name=clinica-stella-maris
server.port=8080

# ============================================================
# BASE DE DATOS - PostgreSQL (RNF-15)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_stella_maris
spring.datasource.username=postgres
spring.datasource.password=2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
# create-drop: crea las tablas al iniciar y las borra al cerrar (desarrollo)
# update: solo actualiza sin borrar datos (cuando ya tengas datos de prueba)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# JWT - Seguridad (RNF-02)
# Cambia el secret por uno seguro antes de producción
# ============================================================
app.jwt.secret=clave-secreta-muy-larga-para-stella-maris-2026-cambiar-en-produccion
app.jwt.expiration-ms=86400000

# ============================================================
# CORREO (RF-20 - Envío de comprobantes)
# Configura con tu cuenta Gmail o servidor SMTP real
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=clinicastellamaris7@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# LOGGING - Logback (requerido por rúbrica)
# ============================================================

logging.file.name=logs/clinica-stella-maris.log

# ============================================================
# ACTUATOR - Monitoreo (health, metrics, info)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.info.env.enabled=true

# Info personalizada de la app (visible en /actuator/info)
info.app.name=Clínica Stella Maris
info.app.description=Sistema de Gestión de Citas Médicas
info.app.version=0.0.1-SNAPSHOT

# ── Chatbot IA (RF-55) ──────────────────────────────────────────────────────
# Obtener clave gratis en: https://aistudio.google.com/app/apikey
# Dejar como "demo" para usar modo de demostración sin costo
chatbot.gemini.api-key=${GEMINI_API_KEY:demo}
chatbot.gemini.model=gemini-2.5-flash

portal.url=http://127.0.0.1:5501
frontend.url=http://127.0.0.1:5502
app.portal.paciente.url=http://127.0.0.1:5501
app.portal.staff.url=http://127.0.0.1:5502