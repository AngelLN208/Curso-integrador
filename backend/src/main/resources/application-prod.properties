# ============================================================
# PERFIL DE PRODUCCION - Clinica Stella Maris
# Se activa con: -Dspring.profiles.active=prod
# Todos los valores sensibles vienen de variables de entorno
# ============================================================

# Base de datos - Neon PostgreSQL (variables inyectadas por Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - CRITICO: update en vez de create-drop
# create-drop borraria todos los datos en cada reinicio del servidor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Correo
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# Chatbot IA
chatbot.gemini.api-key=${GEMINI_API_KEY:demo}
chatbot.gemini.model=gemini-2.5-flash

# URLs de los portales en produccion (se configuran en el Paso 5)
portal.url=${PORTAL_URL}
frontend.url=${FRONTEND_URL}
app.portal.paciente.url=${PORTAL_URL}
app.portal.staff.url=${FRONTEND_URL}

# Logging en produccion - menos verboso que en desarrollo
logging.file.name=logs/clinica-stella-maris.log

# Deshabilita el health check de correo (el SMTP real sigue funcionando via NotificacionScheduler,
# pero el chequeo de Actuator puede fallar por restricciones de red del hosting gratuito)
management.health.mail.enabled=false

# Brevo API (envio de correo via HTTPS, evita el bloqueo SMTP de Render free tier)
resend.api.key=${RESEND_API_KEY}
resend.sender.email=onboarding@resend.dev